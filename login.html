<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SE Project</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">SE Project</span>
    </div>

    <!-- Heading -->
    <h1 class="card-title">Welcome back.</h1>
    <p class="card-subtitle">Sign in to your account to continue.</p>

    <!-- Login Form -->
    <div class="form-group">
      <label for="userId">User ID</label>
      <input
        type="text"
        id="userId"
        name="userId"
        placeholder="Enter your user ID"
        autocomplete="username"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      />
    </div>

    <div class="divider"></div>

    <button type="button" class="btn-submit">Sign In</button>

    <!-- Footer link -->
    <p class="card-footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>

  </div>

</body>
</html>
